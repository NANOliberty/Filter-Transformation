# Render 블루프린트 — 포스터 한 종류만 돌리는 배포판.
# 무료 플랜의 좁은 CPU에 맞춰, 사진 한 장에 변환을 한 번만 한다.
services:
  - type: web
    name: cartoon-poster
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt

    # 임시 파일이 인스턴스 로컬 디스크에 남는다. 늘리면 업로드한 인스턴스와
    # 변환을 요청한 인스턴스가 달라질 수 있으니 하나로 둔다.
    numInstances: 1

    # 무료 플랜은 램 512MB. 워커 하나가 변환 중 300MB쯤 쓴다.
    startCommand: gunicorn -w 1 --threads 2 --timeout 180 -b 0.0.0.0:$PORT app:app

    healthCheckPath: /healthz

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

      # 이 배포판의 핵심 — 포스터 하나만 켠다. 사진 한 장에 열두 번 하던
      # 변환이 한 번이 된다.
      - key: CARTOON_STYLES
        value: "poster"

      # 변환이 한 번뿐이라 해상도를 무료 플랜 기준보다 올려 잡는다.
      - key: CARTOON_MAX_SIDE
        value: "1400"

      - key: CARTOON_MAX_BATCH_FILES
        value: "30"
      - key: CARTOON_MAX_UPLOAD_MB
        value: "12"
      - key: CARTOON_MAX_AGE_SECONDS
        value: "1800"
